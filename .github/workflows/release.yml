name: Release Obsidian plugin

# Publish a release on GitHub (tag = the version in manifest.json, e.g. 0.1.0);
# this builds the plugin and attaches main.js, manifest.json and styles.css to it.
on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Build plugin
        run: |
          npm install
          npm run build
      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            styles.css
      - name: Attach files to the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" main.js manifest.json styles.css --clobber
