name: Build and lint

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm install
      - name: Build
        shell: bash
        run: |
          set +e; npm run build > build.log 2>&1; code=$?
          cat build.log
          if [ $code -ne 0 ]; then split -b 3500 build.log part_; for f in part_*; do echo "::error title=build::$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' "$f")"; done; fi
          exit $code
      - name: Lint
        shell: bash
        run: |
          set +e; npx eslint . -f unix > lint.log 2>&1; code=$?
          cat lint.log
          if [ -s lint.log ]; then split -b 3500 lint.log lpart_; for f in lpart_*; do echo "::warning title=lint::$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' "$f")"; done; fi
          exit $code
